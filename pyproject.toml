[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "node1-governance-kernel"
version = "0.1.0"
description = "Governance runtime for AI agent fleets — privilege separation, tool allowlisting, and audit evidence at the OS level."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Node1 AI", email = "oss@node1.ai"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
node1-validate = "node1_governance_kernel.validator:main"

[project.optional-dependencies]
validator = ["jsonschema>=4.20"]
test = ["pytest>=7.0", "jsonschema>=4.20"]

[project.urls]
Homepage = "https://github.com/node1-ai/node1-governance-kernel"
Documentation = "https://github.com/node1-ai/node1-governance-kernel/tree/main/docs"
Repository = "https://github.com/node1-ai/node1-governance-kernel"
Issues = "https://github.com/node1-ai/node1-governance-kernel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
